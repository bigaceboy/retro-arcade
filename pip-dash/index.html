<script>
'use strict';
const GAME_ID='pipdash';

function spr(w,h,fn){const c=mk(w,h),g=c.getContext('2d');const R=(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh);};fn(R,g);return c;}

function pair(c){return {r:c,l:flipC(c),w:c.width,h:c.height};}
function fromStr(rows,pal){const h=rows.length,w=rows[0].length;return spr(w,h,R=>{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(pal[ch])R(x,y,1,1,pal[ch]);}});}
const FONT={};
('A010101111101101 B110101110101110 C011100100100011 D110101101101110 E111100110100111 F111100110100100 '+
 'G011100101101011 H101101111101101 I111010010010111 J001001001101010 K101101110101101 L100100100100111 '+
 'M101111111101101 N110101101101101 O010101101101010 P110101110100100 Q010101101110011 R110101110101101 '+
 'S011100010001110 T111010010010010 U101101101101111 V101101101101010 W101101111111101 X101101010101101 '+
 'Y101101010010010 Z111001010100111 0111101101101111 1010110010010111 2110001010100111 3110001010001110 '+
 '4101101111001001 5111100110001110 6011100111101111 7111001010010010 8111101111101111 9111101111001110 '+
 ':000010000010000 .000000000000010 -000000111000000 !010010010000010 /001001010100100 \'010010000000000 '+
 '?110001010000010 ,000000000010100 +000010111010000 =000111000111000 >100010001010100 <001010100010001 '+
 '@101111111010000 (010100100100010 )010001001001010 *101010101000000 x000101010101000').split(' ').forEach(s=>FONT[s[0]]=s.slice(1));
function txtRaw(g,s,x,y,col,sc){g.fillStyle=col;
  for(let i=0;i<s.length;i++){const f=FONT[s[i]];if(!f)continue;for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(f.charCodeAt(r*3+c)===49)g.fillRect(x+(i*4+c)*sc,y+r*sc,sc,sc);}}
function text(s,x,y,col='#fff',sc=1,align='left',shadow='#000',g=ctx){
  s=String(s).toUpperCase();const w=s.length*4*sc-sc;
  x=Math.round(align==='center'?x-w/2:align==='right'?x-w:x);
  if(shadow)txtRaw(g,s,x+sc,y+sc,shadow,sc);txtRaw(g,s,x,y,col,sc);

// ---- audio ----
const AU={ctx:null,master:null,music:null,sfx:null,muted:store.get('mute','0')==='1',noise:null,pulse:null,pulse2:null,paused:false};
let pendingSong=null;
function audioUnlock(){
  if(!AU.ctx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    let c;try{c=new AC();}catch(e){return;}AU.ctx=c;
    AU.master=c.createGain();AU.master.gain.value=AU.muted?0:0.85;
    const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
    AU.music=c.createGain();AU.music.gain.value=0.3;AU.music.connect(AU.master);
    AU.sfx=c.createGain();AU.sfx.gain.value=0.6;AU.sfx.connect(AU.master);
    const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    let hold=0;for(let i=0;i<len;i++){if(i%2===0)hold=Math.random()*2-1;d[i]=hold;}AU.noise=b;
    const mkPulse=duty=>{const N=48,re=new Float32Array(N),im=new Float32Array(N);
      for(let n=1;n<N;n++){re[n]=2/(n*Math.PI)*Math.sin(2*Math.PI*n*duty);im[n]=2/(n*Math.PI)*(1-Math.cos(2*Math.PI*n*duty));}
      return c.createPeriodicWave(re,im);};
    AU.pulse=mkPulse(0.25);AU.pulse2=mkPulse(0.125);
    const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);
    setInterval(musicTick,25);
    if(typeof onAudioReady==='function')onAudioReady(c);
    if(pendingSong){const p=pendingSong;pendingSong=null;songName='';playSong(p);}
  }
  if(AU.ctx.state!=='running'&&!AU.paused){try{AU.ctx.resume();}catch(e){}}
}
function setMute(m){AU.muted=m;store.set('mute',m?'1':'0');if(AU.master)AU.master.gain.setTargetAtTime(m?0:0.85,AU.ctx.currentTime,0.02);if(typeof updateButtons==='function')updateButtons();}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,dur,type='square',vol=0.3,when=0,dest=null,slide=0){
  if(!AU.ctx)return;const c=AU.ctx,t=when||c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  if(type==='pulse')o.setPeriodicWave(AU.pulse);else if(type==='pulse2')o.setPeriodicWave(AU.pulse2);else o.type=type;

  g.gain.setValueAtTime(vol,t+Math.max(0.006,dur*0.65));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+0.02);

function noiseHit(dur,vol,ftype,freq,when,dest,fEnd){
  if(!AU.ctx)return;const c=AU.ctx,t=when||c.currentTime;
  const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(freq,t);
  if(fEnd)f.frequency.exponentialRampToValueAtTime(fEnd,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t,Math.random()*1.5);s.stop(t+dur+0.02);
}
function seqNotes(list,type='pulse',vol=0.25,step=0.1,dest){if(!AU.ctx)return;const t=AU.ctx.currentTime;let o=0;
  for(const n of list){const [m,l]=Array.isArray(n)?n:[n,1];if(m!==null)tone(mtof(m),l*step*0.95,type,vol,t+o,dest);o+=l*step;}}
const NOTE_IDX={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nm(s){const m=s.match(/^([A-G]#?)(-?\d)$/);if(!m)throw new Error('bad note '+s);return 12*(+m[2]+1)+NOTE_IDX[m[1]];}
function parseSong(def){
  const toks=def.lead.trim().split(/\s+/),ev=new Array(toks.length).fill(null);
  for(let i=0;i<toks.length;i++){const t=toks[i];if(t==='.'||t==='-')continue;let l=1;while(toks[i+l]==='-')l++;ev[i]={m:nm(t),l};}
  if(toks.length%16)console.warn('song length not multiple of 16',toks.length);
  let bass=null;if(def.bass){const bt=def.bass.trim().split(/\s+/);bass=new Array(bt.length).fill(null);for(let i=0;i<bt.length;i++){const t=bt[i];if(t==='.'||t==='-')continue;let l=1;while(bt[i+l]==='-')l++;bass[i]={m:nm(t),l};}}
  return {bpm:def.bpm,len:toks.length,lead:ev,bass,roots:(def.roots||[]).map(nm),bassPat:def.bassPat,drums:def.drums||0,echo:def.echo,loop:def.loop!==false,leadType:def.leadType||'pulse',vol:def.vol||0.2};
}
let song=null,songStep=0,nextNoteT=0,songName='',songEndCb=null;
function playSong(n,onEnd){if(songName===n&&song)return;songName=n;songEndCb=onEnd||null;if(!AU.ctx){pendingSong=n;return;}song=SONGS[n];songStep=0;nextNoteT=AU.ctx.currentTime+0.06;}
function stopSong(){song=null;songName='';pendingSong=null;}
function musicTick(){
  if(!song||!AU.ctx||AU.ctx.state!=='running')return;
  const c=AU.ctx,sd=60/song.bpm/4;
  if(nextNoteT<c.currentTime-0.25)nextNoteT=c.currentTime+0.02;
  while(song&&nextNoteT<c.currentTime+0.15){
    const st=songStep,t=nextNoteT,ev=song.lead[st];
    if(ev){tone(mtof(ev.m),ev.l*sd*0.92,song.leadType,song.vol,t,AU.music);
      if(song.echo)tone(mtof(ev.m),ev.l*sd*0.8,'pulse2',song.vol*0.35,t+sd*3,AU.music);}
    if(song.bass){const b=song.bass[st];if(b)tone(mtof(b.m),b.l*sd*0.9,'triangle',0.42,t,AU.music);}
    else if(song.roots.length&&st%2===0){const bar=Math.floor(st/16)%song.roots.length;const r=song.roots[bar]+song.bassPat[(st/2)%8];tone(mtof(r),sd*1.7,'triangle',0.42,t,AU.music);}
    const s16=st%16;
    if(song.drums){
      if(s16===0||s16===8||(song.drums===2&&(s16===6||s16===14)))tone(140,0.12,'sine',0.7,t,AU.music,40);
      if(s16===4||s16===12)noiseHit(0.1,0.3,'bandpass',1800,t,AU.music);
      if(st%2===1||song.drums===2)noiseHit(0.03,st%2?0.14:0.06,'highpass',7000,t,AU.music);
    }
    songStep++;nextNoteT+=sd;
    if(songStep>=song.len){if(song.loop)songStep=0;else{const cb=songEndCb;song=null;songName='';songEndCb=null;if(cb)setTimeout(cb,Math.max(0,(nextNoteT-c.currentTime)*1000));}}
  }
}

function addScore(n,x,y){score+=n;if(x!==undefined)pops.push({x,y,txt:String(n),t:40});}
function addCoin(){coinsN++;SFX.coin();addScore(200);if(coinsN>=100){coinsN-=100;lives++;SFX.oneup();}}
function bump(tx,ty){
  const ch=tile(tx,ty),key=tx+','+ty,c=L.content[key];
  if(ch==='?'||(ch==='b'&&c)){
    if(c&&c.type==='multi'){c.n--;coinPop(tx,ty);if(c.n<=0){L.g[ty][tx]='u';delete L.content[key];}}
    else{L.g[ty][tx]='u';
      if(!c||c.type==='coin')coinPop(tx,ty);
      else{items.push({type:c.type==='1up'?'1up':'grow',x:tx*16+8,y:ty*16+16,rise:16,vx:0,vy:0,w:14,h:14});SFX.appear();}

    bumps.push({tx,ty,t:0});
  } else if(ch==='b'){
    if(P.big){L.g[ty][tx]='.';addScore(50);SFX.brk();for(let i=0;i<4;i++)parts.push({x:tx*16+4+(i%2)*8,y:ty*16+4+(i>>1)*8,vx:(i%2?1.2:-1.2),vy:i>>1?-3:-4.5,life:80});}
    else{bumps.push({tx,ty,t:0});SFX.bumpS();}
  } else SFX.bumpS();

  for(const e of enemies){if(e.dead||e.state==='flip')continue;if(Math.abs(e.y-ty*16)<3&&Math.abs(e.x-(tx*16+8))<14)flipEnemy(e,1);}

}

function loadLevel(n,atMid){

function rectOf(el,p=6){const r=el.getBoundingClientRect();return {l:r.left-p,r:r.right+p,t:r.top-p,b:r.bottom+p,cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,w:r.width};}

function onTouch(e){
  e.preventDefault();audioUnlock();
  const playing=document.body.classList.contains('playing');
  const rA=rectOf(EL.A,10),rB=rectOf(EL.B,10),rD=rectOf(EL.dpad,30);
  if(e.type==='touchstart')for(const t of e.changedTouches){const x=t.clientX,y=t.clientY;
    if(inR(rectOf(EL.sound),x,y)){setMute(!AU.muted);continue;}
    if(inR(rectOf(EL.pause),x,y)){togglePause();continue;}
    if(playing&&!S.paused){if(inR(rA,x,y)){I.jumpP=1;continue;}if(inR(rB,x,y)||inR(rD,x,y))continue;}
    tapAction();}
  for(const k in TH)TH[k]=0;
  if(playing)for(const t of e.touches){const x=t.clientX,y=t.clientY;
    if(inR(rA,x,y))TH.jump=1;else if(inR(rB,x,y))TH.run=1;
    else if(inR(rD,x,y)||(x<innerWidth*0.35&&y>innerHeight*0.4)){const dx=x-rD.cx,dy=y-rD.cy,r=(rD.w||100)/2;
      if(Math.hypot(dx,dy)<r*0.18)continue;const ax=Math.abs(dx),ay=Math.abs(dy);
      if(ax>ay*0.5){if(dx<0)TH.l=1;else TH.r=1;}if(ay>ax*0.8){if(dy<0)TH.u=1;else TH.d=1;}}}
  EL.dL.classList.toggle('on',!!TH.l);EL.dR.classList.toggle('on',!!TH.r);EL.dU.classList.toggle('on',!!TH.u);EL.dD.classList.toggle('on',!!TH.d);
  EL.A.classList.toggle('on',!!TH.jump);EL.B.classList.toggle('on',!!TH.run);
}

// ---------------- update ----------------
const WALK=1.4,RUNS=2.4;
function updatePlayer(){
  const p=P;
  if(p.inv>0)p.inv--;
  if(p.state==='dead'){p.t++;if(p.t===30)p.vy=-5;if(p.t>30){p.vy+=0.22;p.y+=p.vy;}if(p.t>180)loseLife();return;}
  if(p.state==='grow'||p.state==='shrink'){p.t++;if(p.t>=48){p.state='normal';p.h=p.big?28:14;}return;}
  if(p.state==='flag'){p.vx=0;if(p.y<176)p.y=Math.min(176,p.y+2);flagY=Math.min(flagY+2,176-48);if(p.y>=176&&flagY>=176-48){p.t++;if(p.t>20){p.state='walkout';p.face=1;}}return;}
  if(p.state==='walkout'){p.vx=1.2;p.vy=Math.min(p.vy+0.42,4.5);moveEnt(p,true);p.anim++;if(p.x>=L.houseX+8){p.hidden=true;p.state='inside';S.state='tally';S.t=0;}return;}
  const run=I.run,max=run?RUNS:WALK,dir=I.l?-1:I.r?1:0;
  if(p.onGround){
    if(dir){if(Math.sign(p.vx)===-dir&&Math.abs(p.vx)>0.5){p.vx+=dir*0.13;p.skid=true;}
      else{p.skid=false;p.face=dir;if(Math.abs(p.vx)>max)p.vx=approach(p.vx,dir*max,0.04);else p.vx=Math.min(max,Math.abs(p.vx)+(run?0.07:0.05))*dir;}}
    else{p.vx=approach(p.vx,0,0.07);p.skid=false;}
    stompCombo=0;
  } else {if(dir)p.vx=clamp(p.vx+dir*0.05,-Math.max(max,Math.abs(p.vx)),Math.max(max,Math.abs(p.vx)));}
  if(I.jumpP&&p.onGround){p.vy=-(4.4+Math.abs(p.vx)*0.25);p.onGround=false;SFX.jump();}
  p.vy=Math.min(p.vy+((I.jump&&p.vy<0)?0.15:0.45),4.5);
  moveEnt(p,true);
  if(p.x-6<camX){p.x=camX+6;if(p.vx<0)p.vx=0;}
  if(Math.abs(p.vx)>0.1&&p.onGround)p.anim+=Math.abs(p.vx)*0.6;
  if(p.y>H+24)die();
  // flag
  if(L.flagX&&p.x+6>=L.flagX&&p.state==='normal'){
    p.state='flag';p.t=0;p.x=L.flagX-6;p.face=1;const h=192-p.y;const pts=h>150?5000:h>120?2000:h>80?800:h>40?400:100;
    addScore(pts,L.flagX+12,p.y-20);stopSong();SFX.flag();flagY=0;if(p.y>176)p.y=176;}
  if(p.state==='normal'&&L.mid&&p.x>L.mid*16)checkpoint=true;
}
function spawnEnemies(){
  while(spawnIdx<L.ents.length&&L.ents[spawnIdx].x<camX+W+24){const t=L.ents[spawnIdx++];
    if(t.type==='bug')enemies.push({type:'bug',x:t.x,y:t.y,vx:-0.5,vy:0,w:14,h:14,state:'walk',t:0});
    else enemies.push({type:'snail',x:t.x,y:t.y,vx:-0.45,vy:0,w:14,h:22,state:'walk',t:0,kickT:0});}
}
function eBox(e){return {x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h};}
function pBox(){return {x:P.x-6,y:P.y-P.h,w:12,h:P.h};}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function updateEnemies(){
  spawnEnemies();
  for(const e of enemies){
    if(e.dead)continue;e.t++;
    if(e.state==='flip'){e.vy+=0.25;e.y+=e.vy;e.x+=e.vx;if(e.y>H+40)e.dead=true;continue;}
    if(e.state==='squish'){if(e.t>30)e.dead=true;continue;}
    if(e.kickT>0)e.kickT--;
    if(e.state==='shell'){e.vx=0;if(e.t>420){e.state='walk';e.h=22;e.vx=P.x<e.x?-0.45:0.45;}}
    e.vy=Math.min(e.vy+0.3,4.5);moveEnt(e,false);
    if(e.hitWall){e.vx=-e.vx;if(e.state==='slide'&&e.x>camX-16&&e.x<camX+W+16)SFX.bumpS();}
    if(e.y>H+30)e.dead=true;
    if(e.x<camX-64||(e.state==='slide'&&e.x>camX+W+120))e.dead=true;
    // shell vs enemies
    if(e.state==='slide'){for(const o of enemies){if(o===e||o.dead||o.state==='flip'||o.state==='squish')continue;if(ov(eBox(e),eBox(o))){flipEnemy(o,Math.sign(e.vx));}}}
  }
  // walkers bump each other
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j];
    if(a.dead||b.dead||a.state!=='walk'||b.state!=='walk')continue;if(ov(eBox(a),eBox(b))){if((a.x<b.x&&a.vx>0)||(a.x>b.x&&a.vx<0))a.vx=-a.vx;if((b.x<a.x&&b.vx>0)||(b.x>a.x&&b.vx<0))b.vx=-b.vx;}}
  enemies=enemies.filter(e=>!e.dead);
  // player interactions
  if(P.state!=='normal')return;
  for(const e of enemies){
    if(e.state==='flip'||e.state==='squish')continue;
    if(!ov(pBox(),eBox(e)))continue;
    const stomp=P.vy>0&&(P.y-(e.y-e.h))<10;
    if(e.type==='snail'&&e.state==='shell'){
      if(e.kickT>0)continue;
      e.state='slide';e.vx=(P.x<e.x?1:-1)*3.4;e.kickT=14;e.t=0;addScore(400,e.x,e.y-16);SFX.kick();
      if(stomp)P.vy=-3.2;continue;}
    if(stomp){
      stompCombo++;const pts=[100,200,400,800,1000,2000,4000,8000][Math.min(stompCombo-1,7)];addScore(pts,e.x,e.y-16);SFX.stomp();
      P.vy=I.jump?-4.6:-3.2;P.y=e.y-e.h-0.1;
      if(e.type==='bug'){e.state='squish';e.t=0;}
      else if(e.state==='walk'){e.state='shell';e.h=14;e.t=0;e.vx=0;e.kickT=10;}
      else if(e.state==='slide'){e.state='shell';e.vx=0;e.t=0;e.kickT=10;}
      continue;}
    if(e.kickT>0&&e.state==='slide')continue;
    if(P.inv<=0)hurt();
  }
}
function updateItems(){
  for(const it of items){
    if(it.rise>0){it.rise-=0.5;it.y-=0.5;if(it.rise<=0)it.vx=1;continue;}
    it.vy=Math.min(it.vy+0.3,4);moveEnt(it,false);if(it.hitWall)it.vx=-it.vx;
    if(it.y>H+20)it.dead=true;
    if(P.state==='normal'&&ov(pBox(),{x:it.x-7,y:it.y-14,w:14,h:14})){it.dead=true;
      if(it.type==='grow'){addScore(1000,it.x,it.y-16);if(!P.big){P.big=true;P.state='grow';P.t=0;P.h=28;SFX.grow();}else SFX.coin();}
      else{lives++;SFX.oneup();pops.push({x:it.x,y:it.y-16,txt:'1UP',t:50});}}
  }
  items=items.filter(i=>!i.dead);
  for(const c of coinEnts){if(!c.got&&P.state==='normal'&&ov(pBox(),{x:c.x-4,y:c.y-7,w:8,h:14})){c.got=true;addCoin();}}
  for(const q of parts){if(q.coin){q.y+=q.vy;q.vy+=0.25;}else{q.x+=q.vx;q.y+=q.vy;q.vy+=0.25;}q.life--;}
  parts=parts.filter(q=>q.life>0);for(const p of pops){p.t--;p.y-=0.5;}pops=pops.filter(p=>p.t>0);
  for(const b of bumps)b.t++;bumps=bumps.filter(b=>b.t<10);
}
function update(){
  S.t++;
  if(S.state==='title'){camX=(S.t*0.5)%(L.w*16-W-200);return;}
  if(S.state==='intro'){if(S.t>150){S.state='play';S.t=0;setPlaying(true);playSong(L.music);}return;}
  if(S.state==='tally'){if(time>0){const n=Math.min(time,2);time-=n;addScore(n*50);if(S.t%3===0)SFX.tick();}else if(S.t>60&&!S.tallyDone){S.tallyDone=true;S.t=0;}
    if(S.tallyDone&&S.t>90){S.tallyDone=false;saveHi();if(S.level<LEVELS.length){intro(S.level+1,false);}else{S.state='ending';S.t=0;setPlaying(false);playSong('title');}}return;}
  if(S.state!=='play')return;
  updatePlayer();
  if(P.state==='grow'||P.state==='shrink'||P.state==='dead'){updateItemsPartial();return;}
  if(P.state==='normal')camX=clamp(Math.max(camX,P.x-W*0.42),0,L.w*16-W);
  updateEnemies();updateItems();
  if(P.state==='normal'){timeAcc++;if(timeAcc>=24){timeAcc=0;time--;if(time===100&&!hurry){hurry=true;SFX.hurry();const s=SONGS[L.music];setTimeout(()=>{if(S.state==='play'&&P.state==='normal'){stopSong();SONGS[L.music+'_fast']=Object.assign({},s,{bpm:s.bpm*1.3});playSong(L.music+'_fast');}},900);}if(time<=0){time=0;die();}}}
  if(P.state==='flag'&&P.t===1)SFX.clearJ();
}

 title:parseSong({bpm:126,echo:1,vol:0.18,roots:['G2','E2','C2','D2'],bassPat:[0,12,7,12,0,12,7,12],drums:1,
  lead:`G5 . B5 . D6 . B5 . G5 . A5 . B5 - - -
        E5 . G5 . B5 . G5 . E5 . F#5 . G5 - - -
        C6 . B5 . A5 . G5 . E5 . G5 . A5 . C6 .
        B5 - - - A5 - - - D6 - - - . . . .`}),
};

// ---------------- render ----------------
function drawHouse(){
  const x=Math.round(L.houseX-camX)-24,y=192;
  if(x>W+10||x<-90)return;
  if(L.house==='barn'){ // a red barn on the hill, a nod to Crawford Farms
    ctx.fillStyle='#a82018';ctx.fillRect(x,y-64,72,64);ctx.beginPath();ctx.moveTo(x-6,y-64);ctx.lineTo(x+36,y-92);ctx.lineTo(x+78,y-64);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(x-6,y-65,84,2);ctx.fillRect(x+24,y-34,24,34);ctx.fillStyle='#1a0a08';ctx.fillRect(x+26,y-32,20,32);
    ctx.fillStyle='#fff';ctx.fillRect(x+4,y-58,64,11);ctx.fillStyle='#a82018';ctx.fillRect(x+5,y-57,62,9);
    text('CRAWFORD FARMS',x+36,y-55,'#fff',1,'center',null);
    ctx.fillStyle='#d8d0b8';ctx.fillRect(x+80,y-84,16,84);ctx.beginPath();ctx.arc(x+88,y-84,8,Math.PI,0);ctx.fill();ctx.fillStyle='#a8a090';ctx.fillRect(x+80,y-60,16,2);ctx.fillRect(x+80,y-36,16,2);
  } else {
    const st=L.theme===2?'#6a6a8a':'#b8a890';
    ctx.fillStyle=st;ctx.fillRect(x+4,y-48,64,48);ctx.fillStyle='#7a3a2a';ctx.beginPath();ctx.moveTo(x-4,y-48);ctx.lineTo(x+36,y-76);ctx.lineTo(x+76,y-48);ctx.fill();
    ctx.fillStyle='#1a0a08';ctx.fillRect(x+26,y-30,20,30);ctx.fillStyle='#ffd060';ctx.fillRect(x+10,y-38,10,10);ctx.fillRect(x+52,y-38,10,10);
  }
}
function drawFlag(){
  if(!L.flagX)return;const x=Math.round(L.flagX-camX);if(x<-20||x>W+20)return;
  ctx.fillStyle='#d8d8d8';ctx.fillRect(x-1,40,2,136);ctx.fillStyle='#3cb043';ctx.fillRect(x-3,34,6,6);ctx.fillStyle='#8ae070';ctx.fillRect(x-2,35,2,2);
  const fy=44+flagY;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x-1,fy);ctx.lineTo(x-17,fy+7);ctx.lineTo(x-1,fy+14);ctx.fill();ctx.fillStyle='#f07a20';ctx.fillRect(x-9,fy+5,4,4);
}
function drawWorld(){
  const cx=Math.floor(camX);
  const bg=BGS[L.theme];const ox=-Math.floor((camX*0.3)%512);for(let x=ox;x<W;x+=512)ctx.drawImage(bg,x,0);
  drawHouse();drawFlag();
  const t=TILES[L.theme],x0=Math.floor(cx/16),x1=Math.min(L.w-1,x0+Math.ceil(W/16)+1);
  for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){let ch=L.g[ty][tx];if(ch==='.')continue;
    if(ch==='#'&&tile(tx,ty-1)!=='#')ch='g';
    let oy=0;for(const b of bumps)if(b.tx===tx&&b.ty===ty)oy=-Math.round(Math.sin(b.t/10*Math.PI)*5);
    const img=t[ch];if(img)ctx.drawImage(img,tx*16-cx,ty*16+oy);}
  const cf=(S.t>>3)%4;
  for(const c of coinEnts)if(!c.got&&c.x>cx-10&&c.x<cx+W+10)ctx.drawImage(COIN[cf],Math.round(c.x-4-cx),Math.round(c.y-7));
  for(const it of items){const img=it.type==='grow'?BERRY:ACORN;ctx.save();if(it.rise>0){ctx.beginPath();ctx.rect(it.x-8-cx,0,16,it.y+it.rise-(16-0));ctx.clip();}
    ctx.drawImage(img,Math.round(it.x-7-cx),Math.round(it.y-14));ctx.restore();}
  for(const e of enemies){
    const x=Math.round(e.x-cx),y=Math.round(e.y);
    if(e.type==='bug'){
      if(e.state==='squish')ctx.drawImage(BUGFLAT,x-8,y-16);
      else if(e.state==='flip'){ctx.save();ctx.translate(x,y-8);ctx.scale(1,-1);ctx.drawImage(BUG[0].l,-8,-8);ctx.restore();}
      else{const p=BUG[(e.t>>3)&1];ctx.drawImage(e.vx>0?p.r:p.l,x-8,y-16);}
    } else {
      if(e.state==='walk'){const p=SNAIL[(e.t>>3)&1];ctx.drawImage(e.vx>0?p.r:p.l,x-8,y-24);}
      else if(e.state==='flip'){ctx.save();ctx.translate(x,y-7);ctx.scale(1,-1);ctx.drawImage(SHELL,-8,-7);ctx.restore();}
      else{const wob=e.state==='shell'&&e.t>340&&(e.t>>2)%2?1:0;ctx.drawImage(SHELL,x-8+wob,y-14);}
    }
  }
  // player
  if(!P.hidden&&!(P.inv>0&&(P.inv>>2)%2&&P.state==='normal')){
    let big=P.big;if(P.state==='grow'||P.state==='shrink')big=((P.t>>2)%2===0)===(P.state==='grow');
    const set=big?FOX.b:FOX.s;let pose='stand';
    if(P.state==='dead')pose='dead';
    else if(!P.onGround&&P.state!=='flag'&&P.state!=='walkout')pose='jump';
    else if(P.skid)pose='skid';
    else if(Math.abs(P.vx)>0.1||P.state==='walkout')pose=['walk1','walk2','stand','walk2'][Math.floor(P.anim/6)%4];
    if(P.state==='flag')pose='jump';
    const pp=(set[pose]||FOX.s[pose]);const img=P.face>0?pp.r:pp.l;
    ctx.drawImage(img,Math.round(P.x-8-cx),Math.round(P.y-img.height));
  }
  for(const q of parts){if(q.coin)ctx.drawImage(COIN[(q.life>>2)%4],Math.round(q.x-cx),Math.round(q.y));else ctx.drawImage(DEBRIS,Math.round(q.x-cx),Math.round(q.y));}
  for(const p of pops)text(p.txt,Math.round(p.x-cx),Math.round(p.y),'#fff',1,'center','#000');
}
function drawHUD(){
  const c=L&&L.theme===2?'#fff':'#fff';
  const cols=[10,W*0.3,W*0.56,W-60];
  text('PIP',cols[0],5,c);text(pad(score,6),cols[0],13,c);
  ctx.drawImage(COIN[0],Math.round(cols[1]),5);text('x'+pad(coinsN,2),cols[1]+10,9,c);
  text('LEVEL',cols[2],5,c);text(String(S.level)+'-'+['','MEADOW','CAVES','SKY'][S.level],cols[2],13,c);
  text('TIME',cols[3],5,c);text(S.state==='title'?'':pad(time,3),cols[3],13,time<=100&&S.state==='play'?'#ff6060':c);
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(S.state==='intro'){drawHUD();text('LEVEL '+S.level,W/2,80,'#fff',2,'center');text(L.name,W/2,100,'#ffd040',2,'center');
    ctx.drawImage(FOX.s.stand.r,W/2-30,130);text('x '+lives,W/2+2,136,'#fff',2,'left');return;}
  if(S.state==='gameover'){drawHUD();text('GAME OVER',W/2,100,'#ff5050',3,'center');if(S.t>120)text(isTouch?'TAP TO CONTINUE':'PRESS ENTER',W/2,140,'#fff',1,'center');return;}
  if(S.state==='ending'){ctx.drawImage(BGS[1],0,0);ctx.drawImage(BGS[1],512,0);for(let x=0;x<W;x+=16){ctx.drawImage(TILES[1].g,x,192);ctx.drawImage(TILES[1]['#'],x,208);}text('PIP MADE IT HOME!',W/2,50,'#fff',2,'center','#000');text('THANKS FOR PLAYING',W/2,76,'#ffd040',1,'center','#000');
    text('FINAL SCORE '+pad(score,6),W/2,96,'#fff',1,'center','#000');text('HI SCORE '+pad(hi,6),W/2,108,'#fff',1,'center','#000');
    ctx.drawImage(FOX.b[['walk1','walk2','stand','walk2'][(S.t>>3)%4]].r,Math.round((S.t*0.8)%(W+32))-16,160);if(S.t>120)text(isTouch?'TAP TO RETURN':'PRESS ENTER',W/2,196,'#fff',1,'center','#000');return;}
  drawWorld();drawHUD();
  if(S.state==='title'){
    ctx.fillStyle='rgba(0,0,40,0.35)';ctx.fillRect(0,0,W,H);
    text('PIP',W/2,34,'#f07a20',6,'center','#5a2000');text('DASH',W/2,70,'#ffd040',5,'center','#5a3a00');
    text('A FOXY PLATFORM ROMP',W/2,102,'#fff',1,'center');
    ctx.drawImage(FOX.b.stand.r,W/2-8,116);
    if((S.t>>5)%2===0)text(isTouch?'TAP TO START':'PRESS ENTER TO START',W/2,160,'#fff',2,'center');
    text(isTouch?'D-PAD MOVE  JUMP (HOLD = HIGHER)  HOLD RUN':'ARROWS MOVE  X/SPACE JUMP  Z/SHIFT RUN',W/2,184,'#ffd040',1,'center');
    text('HI SCORE '+pad(hi,6),W/2,196,'#fff',1,'center');
  }
  if(S.state==='tally')text('LEVEL CLEAR!',W/2,70,'#fff',2,'center');
  if(S.paused){ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);text('PAUSED',W/2,90,'#fff',3,'center');text(isTouch?'TAP TO RESUME':'PRESS P',W/2,120,'#ffd040',1,'center');}
}
// ---------------- loop ----------------
let last=performance.now(),acc=0;const STEP=1000/60;window.__fps=0;let fN=0,fT=0;
function frame(now){requestAnimationFrame(frame);let dt=now-last;last=now;if(dt>250)dt=250;fN++;fT+=dt;if(fT>=1000){window.__fps=fN*1000/fT;fN=0;fT=0;}
  if(window.__wrongOrient&&S.state==='play'&&!S.paused)togglePause();
  const TSc=window.__ts||1;
  if(!S.paused){acc+=dt*TSc;let n=0;while(acc>=STEP&&n<5*TSc){readInput();update();I.jumpP=0;acc-=STEP;n++;}if(n>=5*TSc)acc=0;}
  render();}
window.__game={S,P,get L(){return L},get enemies(){return enemies},get items(){return items},get score(){return score},get coins(){return coinsN},get lives(){return lives},set lives(v){lives=v},
  get time(){return time},set time(v){time=v},get camX(){return camX},keys,intro,startGame,die,bump};
toTitle();requestAnimationFrame(frame);

</script>
